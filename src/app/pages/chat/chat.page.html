<div class="p-2 flex flex-col gap-2">
  <h1 class="text-2xl text-[--accent] font-bold">Messages</h1>

  <div *ngFor="let message of messages; let i = index"
    class="border rounded-xl flex p-4 items-center justify-center hover:shadow-md hover:-translate-y-1 transition-all duration-200"
    [routerLink]="['/chat/message', i]">
    <!-- Avatar -->
    <div class="bg-gray-200 rounded-full size-10 mr-3"></div>

    <!-- Body -->
    <div class="flex-1">

      <div>
        <!-- Top -->
        <div class="flex justify-between items-start">
          <h2 class="text-sm font-bold">{{message.name}}</h2>
          <p class="text-xs text-[--muted-foreground]">{{message.time}}</p>
        </div>

        <!-- Message -->
        <p class="text-xs text-[--secondary-foreground]">{{message.lastMessage}}</p>
      </div>

    </div>

    <!-- Unread -->
    <div *ngIf="message.unread > 0"
      class="rounded-full size-6 text-[--accent-foreground] bg-[--accent] text-center mx-2">
      {{message.unread}}
    </div>

  </div>
</div>
